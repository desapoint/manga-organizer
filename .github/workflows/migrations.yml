name: SQLite migrations

on:
  pull_request:
    paths: ['src/**', 'tests/migrations_smoke.py', '.github/workflows/migrations.yml']
  push:
    branches: [main]
    paths: ['src/**', 'tests/migrations_smoke.py', '.github/workflows/migrations.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    name: Migrate database (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            executable: MangaOrganizer.Server
          - os: windows-2025
            executable: MangaOrganizer.Server.exe
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: dotnet restore src/MangaOrganizer.Server --locked-mode
      - run: dotnet publish src/MangaOrganizer.Server --no-restore -c Release -o publish
      - run: python tests/migrations_smoke.py --app publish/${{ matrix.executable }}
